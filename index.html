<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Tactical Elite v9.5</title>
    <script src="https://unpkg.com/konva@9.3.1/konva.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --neon: #00ffff; --bg: #05070a; --glass: rgba(15, 23, 42, 0.6); --red: #ff4d4d; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; color: white; }
        #canvas-container { width: 100%; height: 100%; position: absolute; z-index: 1; }
        #landscape-lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); color: var(--neon); z-index: 2000; display: none; align-items: center; justify-content: center; font-weight: 900; text-align: center; }
        @media (orientation: portrait) { #landscape-lock { display: flex; } #app { display: none; } }
        .ui-panel { position: absolute; z-index: 10; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 12px; display: flex; gap: 6px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #toolbar-left { top: 15px; left: 15px; flex-direction: column; padding: 8px; }
        #toolbar-right { top: 15px; right: 15px; flex-direction: column; padding: 8px; }
        .btn-icon { width: 44px; height: 44px; border-radius: 10px; border: none; background: rgba(255,255,255,0.05); color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-icon.active { background: var(--neon); color: black; box-shadow: 0 0 12px var(--neon); }
        .btn-record { border: 2px solid var(--red); color: var(--red); }
        .btn-record.active { background: var(--red); color: white; animation: pulse 1.5s infinite; }
        .logo-slot { position: absolute; top: 15px; width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid var(--neon); z-index: 5; background: var(--glass); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #logo-home { left: 75px; } #logo-away { right: 75px; }
        .logo-slot img { width: 100%; height: 100%; object-fit: contain; }
        #config-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; background: rgba(10, 15, 25, 0.98); padding: 20px; border-radius: 20px; border: 2px solid var(--neon); display: none; flex-direction: column; gap: 15px; width: 310px; }
        .config-section { display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
        .row { display: flex; align-items: center; justify-content: space-between; }
        .color-picker { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
        .color-dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.2); cursor: pointer; }
        .pattern-btn { flex: 1; padding: 8px; border: 1px solid var(--neon); background: none; color: white; border-radius: 6px; font-size: 10px; font-weight: 900; }
        .pattern-btn.selected { background: var(--neon); color: black; }
        #recording-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; font-weight: 900; color: var(--neon); }
        .step-counter { font-size: 10px; font-weight: 900; color: var(--neon); text-align: center; line-height: 1.2; margin: 5px 0; }
        input[type="range"] { accent-color: var(--neon); width: 100%; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }
    </style>
</head>
<body>

<div id="landscape-lock"><div>⚽ GIRAR MÓVIL A HORIZONTAL<br>NEXUS TACITCAL ELITE</div></div>

<div id="app">
    <div id="canvas-container"></div>
    <div id="recording-overlay">NEXUS: EXPORTANDO VÍDEO...</div>

    <div class="logo-slot" id="logo-home" onclick="document.getElementById('in-h').click()"><img id="img-h" src=""><input type="file" id="in-h" hidden onchange="upLogo(event,'img-h')"></div>
    <div class="logo-slot" id="logo-away" onclick="document.getElementById('in-a').click()"><img id="img-a" src=""><input type="file" id="in-a" hidden onchange="upLogo(event,'img-a')"></div>

    <div class="ui-panel" id="toolbar-left">
        <button class="btn-icon active" id="btn-select">🖐️</button>
        <button class="btn-icon" id="btn-pen">✎</button>
        <button class="btn-icon" id="btn-arrow">↗️</button>
        <button class="btn-icon" id="btn-rect">🔳</button>
        <button class="btn-icon" id="btn-spawn" style="color: var(--neon)">👥</button>
        <button class="btn-icon" id="btn-undo">↩️</button>
        <button class="btn-icon" id="btn-clear" style="color: var(--red)">🗑️</button>
    </div>

    <div class="ui-panel" id="toolbar-right">
        <button class="btn-icon btn-record" id="btn-record">●</button>
        <button class="btn-icon" id="btn-prev">⏮</button>
        <button class="btn-icon" id="btn-play" style="font-weight: 900; font-size: 11px;">PLAY</button>
        <button class="btn-icon" id="btn-next">⏭</button>
        <div class="step-counter">PASO<br><span id="cur-step">0</span> / <span id="total-step">0</span></div>
        <button id="btn-export" style="background:#10b981; border:none; color:white; width:44px; height:44px; border-radius:10px; font-weight:bold; font-size:10px;">VÍDEO</button>
    </div>

    <div id="config-panel">
        <h3 id="cfg-title" style="margin:0; font-size:14px; color:var(--neon); text-transform:uppercase;">Ajustes</h3>
        <div id="sec-player" class="config-section">
            <div class="row">Dorsal: <input type="number" id="input-dorsal" style="width:45px; background:#000; border:1px solid var(--neon); color:white; text-align:center;"></div>
            <div class="row">Estilo: <button class="pattern-btn" id="pat-solid" onclick="setTeamStyle('solid')">SÓLIDO</button><button class="pattern-btn" id="pat-stripes" onclick="setTeamStyle('stripes')">RAYAS</button></div>
            <div class="row">Color Base:</div><div class="color-picker" id="pick-c1"></div>
            <div id="c2-area" style="display:none;"><div class="row">Color Rayas:</div><div class="color-picker" id="pick-c2"></div></div>
        </div>
        <div id="sec-drawing" class="config-section" style="border-top:1px solid #333; padding-top:10px;">
            <div class="row">Grosor: <input type="range" id="draw-width" min="1" max="15" value="4"></div>
            <div class="row">Trazo:</div>
            <div style="display:flex; gap:5px;"><button class="pattern-btn" onclick="setLineStyle([])">━━</button><button class="pattern-btn" onclick="setLineStyle([15,10])">---</button><button class="pattern-btn" onclick="setLineStyle([2,8])">...</button></div>
            <div class="row">Color:</div><div class="color-picker" id="pick-draw"></div>
        </div>
        <button onclick="saveClose()" style="background:var(--neon); color:black; font-weight:900; border:none; padding:12px; border-radius:10px; margin-top:5px;">ACEPTAR</button>
    </div>
</div>
